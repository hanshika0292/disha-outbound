name: Deploy

# Manual trigger. Needs repo secrets FLY_API_TOKEN and VERCEL_TOKEN, a real app
# name in fly.toml, and a committed uv.lock (Dockerfile.prod copies it). To deploy on
# every push instead, replace this block with:  push: { branches: [main] }
on:
  workflow_dispatch:

jobs:
  # ── API → Fly.io ────────────────────────────────────────────────────────────
  deploy-api:
    name: Deploy API (Fly.io)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # ── UI → Vercel ─────────────────────────────────────────────────────────────
  deploy-ui:
    name: Deploy UI (Vercel)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel env / project config
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ui

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ui

      - name: Deploy prebuilt output
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ui
